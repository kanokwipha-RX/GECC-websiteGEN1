services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gecc
      POSTGRES_USER: gecc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gecc -d gecc]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gecc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/gecc
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      BASE_PATH: ${BASE_PATH-/sskgecc}
      COOKIE_SECURE: "true"
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:8080
    volumes:
      - files:/app/var/files
    healthcheck:
      test: [CMD, node, -e, "import('./server/config.js').then(({basePath})=>fetch('http://127.0.0.1:8080'+basePath(process.env.BASE_PATH)+'/api/health')).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  database:
  files:
