# Include inside the EXISTING HTTPS VirtualHost for www.osscsskfda.org.
# Requires proxy and proxy_http modules. Preserve all other site routes.
# Backend BASE_PATH=/sskgecc; use the same prefix on both sides.
ProxyPreserveHost On
RedirectMatch 308 ^/sskgecc$ /sskgecc/
ProxyPass        /sskgecc/ http://127.0.0.1:8080/sskgecc/ retry=0 timeout=30
ProxyPassReverse /sskgecc/ http://127.0.0.1:8080/sskgecc/
<Location /sskgecc/>
    LimitRequestBody 12582912
</Location>
